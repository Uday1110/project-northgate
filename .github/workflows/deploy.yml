name: Build, Test & Deploy to Google Cloud Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REPO: northgate-repo
  BACKEND_SERVICE_NAME: northgate-backend
  FRONTEND_SERVICE_NAME: northgate-frontend

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          export PYTHONPATH=backend
          pytest backend/tests/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build

  deploy:
    name: Build Docker Containers & Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: Authenticate with Google Cloud
      # Supports either Service Account Key (secrets.GCP_SA_KEY) or Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 2: Install Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 460.0.0'

      # Step 3: Configure Docker for GCP Artifact Registry
      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Step 4: Build & Deploy Backend
      - name: Build & Push Backend Docker Image
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.BACKEND_SERVICE_NAME }}:latest"
          
          docker build -t $IMAGE_TAG -t $LATEST_TAG ./backend
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.BACKEND_SERVICE_NAME }}:${{ github.sha }}"
          
          gcloud run deploy ${{ env.BACKEND_SERVICE_NAME }} \
            --image $IMAGE_TAG \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "ENVIRONMENT=production"

          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT

      # Step 5: Build & Deploy Frontend with Backend URL injected
      - name: Build & Push Frontend Docker Image
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.FRONTEND_SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.FRONTEND_SERVICE_NAME }}:latest"
          
          docker build \
            --build-arg VITE_API_URL=${{ env.BACKEND_URL }} \
            -t $IMAGE_TAG \
            -t $LATEST_TAG \
            ./frontend
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

      - name: Deploy Frontend to Cloud Run
        id: deploy-frontend
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.FRONTEND_SERVICE_NAME }}:${{ github.sha }}"
          
          gcloud run deploy ${{ env.FRONTEND_SERVICE_NAME }} \
            --image $IMAGE_TAG \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5

          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT

      # Step 6: Post Deployment Summary to GitHub Actions Job
      - name: Deployment Summary
        run: |
          echo "### 🚀 Project Northgate Deployed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Cloud Run Endpoint |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend UI** | [${{ env.FRONTEND_URL }}](${{ env.FRONTEND_URL }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | [${{ env.BACKEND_URL }}/docs](${{ env.BACKEND_URL }}/docs) |" >> $GITHUB_STEP_SUMMARY
